volumes:
  postgres_data:

services:

  db:
    volumes:
      - postgres_data:/var/lib/postgresql/data
    image: postgres:17
    shm_size: 128mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: users_db
    ports:
      - 5432:5432

  adminer:
    image: adminer
    ports:
      - 8080:8080
